@keyframes introOut{to{opacity:0;visibility:hidden;transform:scale(1.04);}}
.intro-svg{width:min(340px,72vw);height:auto;filter:drop-shadow(0 8px 30px rgba(0,0,0,0.5));}
.intro-track{fill:none;stroke:#6899e0;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:620;stroke-dashoffset:620;animation:carve 2s cubic-bezier(.5,0,.3,1) .3s forwards;}
.intro-track.b{stroke:#8fb4e8;animation-delay:.42s;}
.intro-spray{fill:rgba(160,200,240,0.5);opacity:0;animation:sprayPop .4s ease forwards;}
@keyframes carve{to{stroke-dashoffset:0;}}
@keyframes sprayPop{0%{opacity:0;transform:scale(0);}60%{opacity:.8;}100%{opacity:0;transform:scale(1.6);}}

.intro-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:4px;color:#5a7a90;margin-top:26px;opacity:0;animation:introText .8s ease 1.4s forwards;}
.intro-title{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:800;color:#e8f2f8;letter-spacing:-0.5px;text-align:center;line-height:1.05;margin-top:6px;opacity:0;animation:introText .8s ease 1.6s forwards;}
.intro-title em{font-style:normal;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,0.35);}
.intro-enter{margin-top:22px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:3px;color:#3d5a72;opacity:0;animation:introPulse 1.6s ease 2.2s infinite;}
